<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Chip Planner · Gameweek HQ
    </title>

    <link
        rel="icon"
        type="image/png"
        href="{{ url_for(
            'static',
            filename='GHQ_app.png'
        ) }}"
    >

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

<div class="page">

    <header class="hq-header">

        <div class="hq-brand">

            <div class="hq-logo-placeholder">
                <img
                    src="{{ url_for(
                        'static',
                        filename='GHQ_Shield.png'
                    ) }}"
                    alt="Gameweek HQ crest"
                    class="hq-logo"
                >
            </div>

            <div>
                <span class="hq-kicker">
                    CHIP STRATEGY
                </span>

                <h1>
                    Chip Planner
                </h1>

                <span class="hq-subtitle">
                    Opportunity, value and timing
                </span>
            </div>

        </div>

        <div class="hq-header-actions">
            <a
                href="{{ url_for('history') }}"
                class="hq-nav-link"
            >
                HISTORY
            </a>

            <a
                href="{{ url_for('index') }}"
                class="hq-nav-link"
            >
                DASHBOARD
            </a>
        </div>

    </header>

    <main
        id="chip-planner-content"
        aria-live="polite"
        aria-busy="true"
    >

        <section class="card chip-loading-card">

            <div class="chip-loading-spinner"></div>

            <div>
                <span class="team-label">
                    BUILDING PLAN
                </span>

                <h2>
                    Loading current chip data…
                </h2>

                <p>
                    Checking your live FPL squad,
                    chip availability and player
                    projections.
                </p>
            </div>

        </section>

        <div class="chip-loading-grid">
            <div class="chip-loading-placeholder"></div>
            <div class="chip-loading-placeholder"></div>
            <div class="chip-loading-placeholder"></div>
            <div class="chip-loading-placeholder"></div>
        </div>

    </main>

</div>

<script>
(async function loadChipPlanner() {

    const target = document.getElementById(
        "chip-planner-content"
    );

    try {

        const response = await fetch(
            "{{ url_for('chip_data') }}",
            {
                headers: {
                    "X-Requested-With":
                        "fetch"
                }
            }
        );

        const html = await response.text();

        target.innerHTML = html;

        if (!response.ok) {
            throw new Error(
                "Chip Planner request failed"
            );
        }

        const opportunityTarget =
            document.getElementById(
                "chip-opportunity-slot"
            );

        if (opportunityTarget) {

            fetch(
                "{{ url_for('chip_opportunity') }}",
                {
                    headers: {
                        "X-Requested-With":
                            "fetch"
                    }
                }
            )
                .then(
                    response =>
                        response.text().then(
                            html => ({
                                response,
                                html
                            })
                        )
                )
                .then(
                    ({ response, html }) => {
                        opportunityTarget.outerHTML =
                            html;

                        if (!response.ok) {
                            throw new Error(
                                "Chip opportunity "
                                + "request failed"
                            );
                        }

                        document
                            .querySelectorAll(
                                ".chip-opportunity-row[data-chip]"
                            )
                            .forEach(row => {
                                const chip =
                                    row.dataset.chip;

                                const target =
                                    document.querySelector(
                                        '[data-chip-strategy="'
                                        + chip
                                        + '"]'
                                    );

                                if (!target) {
                                    return;
                                }

                                const decision =
                                    row.querySelector(
                                        ".decision-label"
                                    );
                                const confidence =
                                    row.querySelector(
                                        ".decision-confidence"
                                    );
                                const reason =
                                    row.querySelector(
                                        ".decision-reason"
                                    );

                                const targetDecision =
                                    target.querySelector(
                                        "strong"
                                    );
                                const targetReason =
                                    target.querySelector(
                                        "small"
                                    );

                                if (
                                    decision
                                    && targetDecision
                                ) {
                                    targetDecision.textContent =
                                        decision.textContent.trim();
                                    targetDecision.className =
                                        decision.className;
                                }

                                if (
                                    targetReason
                                    && reason
                                ) {
                                    const confidenceText =
                                        confidence
                                        ? confidence.textContent.trim()
                                        : "";

                                    targetReason.textContent =
                                        confidenceText
                                        + (
                                            confidenceText
                                            ? " · "
                                            : ""
                                        )
                                        + reason.textContent.trim();
                                }
                            });
                    }
                )
                .catch(
                    error => {
                        console.error(error);
                    }
                );
        }

    } catch (error) {

        if (
            !target.querySelector(
                ".chip-load-error"
            )
        ) {
            target.innerHTML = `
                <section
                    class="card chip-load-error"
                >
                    <span class="team-label">
                        CHIP PLANNER
                    </span>

                    <h2>
                        Unable to load chip data
                    </h2>

                    <p>
                        The page itself is working,
                        but the live FPL data request
                        failed.
                    </p>

                    <button
                        type="button"
                        onclick="window.location.reload()"
                    >
                        TRY AGAIN
                    </button>
                </section>
            `;
        }

        console.error(error);

    } finally {

        target.setAttribute(
            "aria-busy",
            "false"
        );

    }

})();
</script>

</body>
</html>
